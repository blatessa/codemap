<title>Codemap Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed architecture canvas grouped into web / server lanes; a details drawer slides over the right edge. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#1a2130; --muted:#5b6578; --line:#d3d9e3; --lane:#e5e9f0;
  --edge:#a3acbb; --accent:#e0560b; --accent-soft:#fff0e5; --plan:#6a45d8; --plan-soft:#f0ebff;
  --db:#2a66d1; --http:#c0397a; --queue:#0f8576; --mail:#a86c12; --warn:#b4231b;
  --code-bg:#f6f8fb; --c-kw:#7a3fc2; --c-str:#1d7a4a; --c-com:#8a93a3; --c-num:#b05a00;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b23; --ink:#e4e8ef; --muted:#939eb1; --line:#2a313d; --lane:#131820;
  --edge:#4b5464; --accent:#ff8a3d; --accent-soft:#3a2414; --plan:#b39bff; --plan-soft:#261d3f;
  --db:#6d9fff; --http:#ff7eb6; --queue:#3cc6b0; --mail:#e2aa52; --warn:#ff6b5e;
  --code-bg:#11161d; --c-kw:#c3a2ff; --c-str:#7fd3a0; --c-com:#6b7486; --c-num:#f0a45b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b23; --ink:#e4e8ef; --muted:#939eb1; --line:#2a313d; --lane:#131820;
  --edge:#4b5464; --accent:#ff8a3d; --accent-soft:#3a2414; --plan:#b39bff; --plan-soft:#261d3f;
  --db:#6d9fff; --http:#ff7eb6; --queue:#3cc6b0; --mail:#e2aa52; --warn:#ff6b5e;
  --code-bg:#11161d; --c-kw:#c3a2ff; --c-str:#7fd3a0; --c-com:#6b7486; --c-num:#f0a45b; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--mono);font-size:15px;font-weight:600;margin:0}
.top .repo{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:auto}
.seg button{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;padding:6px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button.plan[aria-pressed="true"]{background:var(--plan);color:#fff}

.stage{flex:1;position:relative;min-height:0;display:flex}
.canvas{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg#map.dragging{cursor:grabbing}
svg#map.connecting{cursor:crosshair}
.tools{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.tools>*{pointer-events:auto}
.tool{all:unset;cursor:pointer;font-size:12px;font-weight:500;padding:6px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.tool:hover{border-color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tool:disabled{opacity:.45;cursor:default}
.tool.plan{color:var(--plan);border-color:var(--plan)}
.search{position:relative}
.search input{width:200px;max-width:52vw;box-sizing:border-box;font-family:var(--mono);font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.results{position:absolute;top:calc(100% + 4px);left:0;width:280px;max-width:80vw;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 8px 24px rgba(10,20,40,.12);display:flex;flex-direction:column}
.res{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:5px 8px;border-radius:5px;font-family:var(--mono);font-size:12px}
.res:hover,.res.act{background:var(--bg)}
.res .m{color:var(--muted);font-size:11px}
.banner{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:var(--plan);color:#fff;font-size:12.5px;padding:7px 12px;border-radius:7px;max-width:calc(100% - 32px);text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);
  overflow:auto;padding-block:16px 24px;padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-8px 0 24px rgba(10,20,40,.06)}
.dhead{display:flex;gap:10px;align-items:flex-start}
.dhead>div{flex:1;min-width:0}
.x{all:unset;cursor:pointer;font-size:18px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:5px}
.x:hover{background:var(--bg)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.eyebrow.plan{color:var(--plan)}
.drawer h2{font-family:var(--mono);font-size:15px;font-weight:600;margin:0;word-break:break-word}
.where{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px;word-break:break-all}
.drawer p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid currentColor;color:var(--warn);display:inline-block}
.links{display:flex;flex-direction:column;gap:1px}
.lnk{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:3px 6px;border-radius:4px;display:flex;gap:8px;align-items:baseline;min-width:0;word-break:break-word}
.lnk:hover{background:var(--bg)}
.lnk.prop{color:var(--plan)}
.lnk .q{color:var(--muted);font-size:11px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>div{min-width:0}
.tree{display:flex;flex-direction:column;font-family:var(--mono);font-size:12px}
.trow{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;padding:3px 6px;border-radius:4px;cursor:pointer;min-width:0}
.trow:hover{background:var(--bg)}
.trow .l{display:flex;gap:6px;align-items:baseline;min-width:0}
.trow .m{color:var(--muted)}
.trow.prop .l{color:var(--plan)}
.trow .q{color:var(--muted);font-size:11px;word-break:break-word;padding-left:14px}
.trow .seen{color:var(--muted);font-style:italic}
.k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.k.db{color:var(--db)}.k.http{color:var(--http)}.k.queue{color:var(--queue)}.k.mail{color:var(--mail)}
.code{display:grid;grid-template-columns:auto 1fr;background:var(--code-bg);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.code pre{margin:0;padding:10px 0;font-family:var(--mono);font-size:11.5px;line-height:1.6;tab-size:3}
.code .g{padding-inline:10px 8px;color:var(--muted);text-align:right;user-select:none;border-right:1px solid var(--line)}
.code .c{padding-inline:10px;overflow-x:auto;min-width:0}
.c-kw{color:var(--c-kw)}.c-str{color:var(--c-str)}.c-com{color:var(--c-com);font-style:italic}.c-num{color:var(--c-num)}
details.test{border:1px solid var(--line);border-radius:7px}
details.test+details.test{margin-top:6px}
details.test summary{cursor:pointer;padding:7px 10px;font-family:var(--mono);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
details.test summary .m{color:var(--muted);font-size:11px}
details.test .code{border:0;border-top:1px solid var(--line);border-radius:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:6px;border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--plan);border-color:var(--plan);color:#fff}
.btn.danger{color:var(--warn)}
.prow{display:flex;gap:8px}
.prow select{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea,.prow select{font-family:var(--mono);font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.field textarea{font-family:var(--sans);min-height:64px;resize:vertical}
.items{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:3px 0}
.item span{flex:1;min-width:0;word-break:break-word}
.item .kind{flex:none;font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:64px}
.item button{all:unset;cursor:pointer;color:var(--muted);padding:0 6px;border-radius:4px}
.item button:hover{color:var(--warn);background:var(--bg)}
:root{--note:#c48a00;--note-soft:#fdf5e1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--note:#f2c14e;--note-soft:#2c2513}}
:root[data-theme="dark"]{--note:#f2c14e;--note-soft:#2c2513}
.pop{position:absolute;top:calc(100% + 4px);left:0;width:260px;max-width:80vw;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 8px 24px rgba(10,20,40,.12);display:flex;flex-direction:column;gap:2px;z-index:2}
.vrow{display:flex;align-items:center;gap:4px}
.vrow .res{flex:1}
.vrow .del{all:unset;cursor:pointer;color:var(--muted);padding:2px 7px;border-radius:4px}
.vrow .del:hover{color:var(--warn);background:var(--bg)}
.vsave{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--line);margin-top:2px}
.vsave input{flex:1;min-width:0;font-family:var(--mono);font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.vsave button{all:unset;cursor:pointer;font-size:12px;font-weight:500;padding:5px 9px;border-radius:5px;border:1px solid var(--line)}
.notes{display:flex;flex-direction:column;gap:6px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;padding:8px 10px;border-radius:7px;background:var(--note-soft);border-left:3px solid var(--note)}
.note span{flex:1;min-width:0;word-break:break-word}
.note button{all:unset;cursor:pointer;color:var(--muted);padding:0 4px;border-radius:4px}
.note button:hover{color:var(--warn)}
.addnote{display:flex;flex-direction:column;gap:6px}
.addnote textarea{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-height:52px;resize:vertical}
.nmark{fill:var(--note)}
.drawer.wide{width:560px}
.back{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);align-self:flex-start}
.back:hover{color:var(--ink)}
.ptitle{all:unset;font-family:var(--mono);font-size:17px;font-weight:600;border-bottom:1px dashed transparent;padding:2px 0}
.ptitle:hover,.ptitle:focus{border-bottom-color:var(--line)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:-8px}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid transparent}
.pill.open{background:var(--plan-soft);color:var(--plan)}
.pill.archived{background:var(--bg);color:var(--muted);border-color:var(--line)}
.dochead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dochead .eyebrow{margin:0}
.btn.sm{padding:4px 10px;font-size:12px}
.mdedit{width:100%;box-sizing:border-box;min-height:320px;font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);resize:vertical}
.md{font-size:14px;line-height:1.6;color:var(--ink)}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3{font-family:var(--sans);font-weight:600;margin:18px 0 6px;font-size:15px}
.md h1{font-size:17px}
.drawer .md p{margin:0 0 10px;color:var(--ink);font-size:14px;line-height:1.6}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin:2px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:7px;padding:10px;overflow-x:auto}
.md pre code{border:0;padding:0}
.md blockquote{margin:0 0 10px;padding:2px 12px;border-left:3px solid var(--line)}
.drawer .md blockquote p{color:var(--muted)}
.md a{color:var(--accent)}
.plctl{display:flex;gap:8px}
.plctl input{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.plctl select{font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.seg.sm{margin-left:0;align-self:flex-start}
.seg.sm button{padding:5px 11px;font-size:12px}
.plist{display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.pitem{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:7px;border:1px solid transparent}
.pitem:hover{background:var(--bg);border-color:var(--line)}
.pn{font-family:var(--mono);font-size:13px;font-weight:600}
.pm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.px{font-size:12.5px;color:var(--muted);line-height:1.45}
.drawer p.doc{color:var(--ink);font-size:13.5px;line-height:1.55;margin-top:-6px}
.edge.decl{stroke-dasharray:9 5}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px;line-height:1.45}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;word-break:break-word}
.facts a{color:var(--accent)}
.cols-t{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.cols-t td{padding:5px 6px;border-bottom:1px solid var(--line)}
.cols-t td:nth-child(2),.cols-t td:nth-child(3){color:var(--muted)}
.cols-t td:nth-child(3){text-align:right}
.chk{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:2px 0;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.arect{fill:var(--lane)}
.area.asel .arect{stroke:var(--accent);stroke-width:1.5}
.area.empty .arect{stroke:var(--line);stroke-dasharray:6 5;fill:transparent}
.ahead{cursor:move}
.ahead:hover .alabel{fill:var(--ink)}
.alabel{font-family:var(--sans);font-size:12.5px;font-weight:600;fill:var(--muted)}
.mod.msel .box{stroke:var(--accent);stroke-width:2}
.tgl{cursor:pointer}
.tgl:hover .caret{fill:var(--ink)}
.arch{font-family:var(--mono);font-size:12px;color:var(--muted);align-self:center}
.archrow{display:flex;gap:8px}
.archrow input{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}

/* SVG */
.lane{fill:var(--lane)}
.lanelbl{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.mod.ext .box{stroke-dasharray:4 3}
.mod.prop .box{stroke:var(--plan);stroke-dasharray:6 4;fill:var(--plan-soft)}
.mod.touched .box{stroke:var(--accent);stroke-width:1.5}
.mod.dim .box{opacity:.55}
.mname{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
.mod.prop .mname{fill:var(--plan)}
.msub{font-family:var(--sans);font-size:10.5px;fill:var(--muted)}
.caret{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.mhead{cursor:move}
.mhead:hover .mname{text-decoration:underline}
.add{cursor:pointer}
.add rect{fill:var(--plan-soft);stroke:var(--plan)}
.add text{font-family:var(--mono);font-size:14px;font-weight:600;fill:var(--plan)}
.hit{fill:transparent}
.sep{stroke:var(--line)}
.fn{cursor:pointer}
.fn text{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.fn .fm{font-size:10px;font-weight:600;fill:var(--muted)}
.fn .tag{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tag.db{fill:var(--db)}.tag.http{fill:var(--http)}.tag.queue{fill:var(--queue)}.tag.mail{fill:var(--mail)}
.fn .untested{fill:var(--warn)}
.fn:hover .hit{fill:var(--bg)}
.fn.dim{opacity:.32}
.fn.on .lbl{font-weight:600}
.fn.on .fm{fill:var(--accent)}
.fn .dot{fill:var(--accent);opacity:0}
.fn.on .dot{opacity:1}
.fn.prop .lbl,.fn.prop .fm{fill:var(--plan)}
.fn.prop .hit{stroke:var(--plan);stroke-dasharray:4 3;stroke-width:1}
.fn.sel .hit{fill:var(--accent-soft)}
.fn.sel .lbl{fill:var(--accent)}
.fn.from .hit{fill:var(--plan-soft);stroke:var(--plan);stroke-width:1.5;stroke-dasharray:none}
.fn.hov .hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.edge{fill:none;stroke:var(--edge);stroke-width:1.2}
.edge.net{stroke-dasharray:2 3}
.edge.on{stroke:var(--accent);stroke-width:2}
.edge.prop{stroke:var(--plan);stroke-dasharray:6 4;stroke-width:1.6}
.edge.prop.on{stroke-width:2.2}
.edge.dim{opacity:.13}
.mk-n{fill:var(--edge)}.mk-h{fill:var(--accent)}.mk-p{fill:var(--plan)}

@media (max-width:760px){
  html,body{height:auto}
  .stage{flex-direction:column}
  .canvas{height:72vh;flex:none}
  .drawer,.drawer.wide{position:static;width:auto;border-left:0;border-top:1px solid var(--line);box-shadow:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cols{grid-template-columns:1fr}
  .seg{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.edge,.fn,.box{transition:opacity .15s,stroke .15s}}
</style>

<header class="top">
  <h1>codemap</h1>
  <span class="repo">shop · sample data</span>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-explore" aria-pressed="true">Explore</button>
    <button id="m-propose" class="plan" aria-pressed="false">Propose</button>
  </div>
</header>

<div class="stage">
  <div class="canvas">
    <svg id="map" aria-label="Architecture map"></svg>
    <div class="tools">
      <div class="search"><input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search the map"><div class="results" id="results" hidden></div></div>
      <div class="search"><button class="tool" id="viewsbtn" aria-expanded="false">Views ▾</button><div class="pop" id="views" hidden></div></div>
      <button class="tool" id="zin" aria-label="Zoom in">+</button>
      <button class="tool" id="zout" aria-label="Zoom out">−</button>
      <button class="tool" id="fit">Fit</button>
      <button class="tool" id="focus" aria-pressed="false">Focus</button>
      <button class="tool" id="collapse">Collapse all</button>
      <button class="tool" id="reset" hidden>Reset layout</button>
      <button class="tool" id="addarea">+ Area</button>
      <button class="tool plan" id="addmod" hidden>+ Module</button>
    </div>
    <div class="banner" id="banner" hidden></div>
  </div>
  <aside class="drawer" id="drawer" hidden></aside>

// Place reserves stock, charges the card and saves the order, in that order.
// If the charge fails, the reservation is left for the expire-carts job to release.
func (s *Service) Place(ctx context.Context, u *auth.User, req CreateOrder) (*Order, error) {
	if err := s.inventory.Reserve(ctx, req.Items); err != nil {
		return nil, fmt.Errorf("reserve: %w", err)
	}
	charge, err := s.payments.Charge(ctx, u.ID, req.Total())
	if err != nil {
		return nil, fmt.Errorf("charge: %w", err)
	}
	o := &Order{UserID: u.ID, Items: req.Items, ChargeID: charge.ID, Status: "pending"}
	if err := s.repo.Insert(ctx, o); err != nil {
		return nil, err
	}
	s.events.Publish(ctx, "order.placed", o)
	return o, nil
}

// Reserve holds stock for each item and fails with ErrOutOfStock if any item is short.
// Not transactional: earlier items stay reserved if a later one fails.
func (s *Store) Reserve(ctx context.Context, items []Item) error {
	for _, it := range items {
		tag, err := s.db.Exec(ctx,
			`UPDATE stock SET reserved = reserved + $2
			 WHERE sku = $1 AND on_hand - reserved >= $2`,
			it.SKU, it.Qty)
		if err != nil {
			return err
		}
		if tag.RowsAffected() == 0 {
			return ErrOutOfStock{SKU: it.SKU}
		}
	}
	return nil
}

// so Stripe never retries a failed MarkPaid.
func (h *Handler) HandleWebhook(w http.ResponseWriter, r *http.Request) {
	body, _ := io.ReadAll(r.Body)
	ev, err := h.verifySignature(body, r.Header.Get("Stripe-Signature"))
	if err != nil {
		http.Error(w, "bad signature", 400)
		return
	}
	if ev.Type == "payment_intent.succeeded" {
		if err := h.orders.MarkPaid(r.Context(), ev.Data.Object["id"].(string)); err != nil {
			log.Printf("mark paid: %v", err) // still returns 200
		}
	}
	w.WriteHeader(200)
}

    const q=QUEUES[id];
    h+=`<div class="cols">${section('Published by',list(IN[id],'from'))}${section('Subscribers',list(OUT[id],'to'))}</div>`;
    if(q) h+=section('Message',`<div class="where" style="margin:0 0 6px">${esc(q.type)} · ${esc(q.file)}:${q.line}</div>${codeBlock(q.code,q.line)}`);
  }else{
    h+=section('Called by',list(IN[id],'from'));
    if(OUT[id].length) h+=section('Calls us',list(OUT[id],'to'));
  }
  return h;
}
function testsHtml(list){
  if(!list.length) return `<span class="chip">No tests</span>`;
  return list.map(({t,direct,via})=>`<details class="test"><summary><span>${esc(t.name)}</span><span class="m">${esc(t.file)}:${t.line}${direct?'':' · via '+esc(via)}</span></summary>${codeBlock(t.code,t.line)}</details>`).join('');
}
const section=(title,body)=>`<div><p class="eyebrow">${title}</p>${body}</div>`;
function plRows(){
  const L=state.plist,q=L.q.trim().toLowerCase(),cnt=p=>p.mods.length+p.fns.length+p.edges.length;
  const rows=proposals.map((p,i)=>({p,i}))
    .filter(({p})=>(L.status==='all'||p.status===L.status)&&(!q||(p.name+' '+p.body).toLowerCase().includes(q)))
    .sort((a,b)=>L.sort==='name'?a.p.name.localeCompare(b.p.name):L.sort==='status'?a.p.status.localeCompare(b.p.status)||b.p.updated.localeCompare(a.p.updated):b.p.updated.localeCompare(a.p.updated));

    <span class="pm"><span class="pill ${p.status}">${p.status}</span>${p.pr?`<span>${esc(p.pr)}</span>`:''}<span>${cnt(p)} changes</span><span>${fmtDate(p.updated)}</span></span>
    ${p.body?`<span class="px">${esc(excerpt(p.body))}</span>`:''}</button>`).join('')||'<p>No proposals match.</p>';

function proposalList(){

  }else if(state.sel&&state.sel.startsWith('area:')){

    h=`<div class="dhead"><div><p class="eyebrow ${f.prop?'plan':''}">${esc(eyebrow)}</p><h2>${esc(f.m&&f.m!=='PAGE'?f.m+' '+f.label:f.label)}</h2>

      ${src&&src.doc?`<p class="doc">${esc(src.doc)}</p>`:''}`;
    if(P()&&prop()) h+=`<div class="btns">${m.ext?'':'<button class="btn primary" data-act="connect">Add a call</button>'}${f.prop?'<button class="btn danger" data-act="remove">Remove</button>':''}</div>`;

      if(src) h+=section('Source',codeBlock(src.code,src.line));
      if(!f.prop) h+=section('Tests along this path',testsHtml(testsFor([...S.down.nodes])));
    }else{
      const ents=[...S.up.nodes].filter(isEntry);
      h+=`<div class="cols">${section('Called from',linkList(IN[id],'from'))}${section('Calls',linkList(OUT[id],'to'))}</div>`;
      h+=section('Reached by',ents.length?`<div class="links">${ents.map(x=>`<button class="lnk ${NODE[x].f.prop?'prop':''}" data-node="${x}">${esc(qn(x))}</button>`).join('')}</div>`:'<span class="chip">Unreachable</span>');
      if(src) h+=section('Source',codeBlock(src.code,src.line));
      if(!f.prop) h+=section('Tests',testsHtml(testsFor([id])));
    }
  }else if(P()&&state.pi==null){
    h=proposalList();
  }else if(P()){
    const p=prop();
    const items=[...p.mods.map(m=>({kind:'module',label:m.name,act:`rm-mod:${m.id}`})),
      ...p.fns.map(f=>({kind:f.mod==='entry'||f.mod==='pages'?'entry':NODE[f.id]?.m.ext?'external':'function',label:NODE[f.id]?qn(f.id):f.label,act:`rm-fn:${f.id}`})),
      ...p.edges.map((e,i)=>NODE[e.from]&&NODE[e.to]?{kind:'call',label:`${qn(e.from)} → ${qn(e.to)}`,act:`rm-edge:${i}`}:null).filter(Boolean)];
    h=`<button class="back" data-act="list">← Proposals</button>
      <input class="ptitle" id="p-name" value="${esc(p.name)}" autocomplete="off" aria-label="Proposal name">
      <div class="meta"><span class="pill ${p.status}">${p.status}</span>${p.pr?`<span>${esc(p.pr)}</span>`:''}<span>Updated ${fmtDate(p.updated)}</span></div>
      <div><div class="dochead"><p class="eyebrow">Document</p><button class="btn sm" data-act="${state.editing?'donedoc':'editdoc'}">${state.editing?'Done':'Edit'}</button></div>
      ${state.editing?`<textarea class="mdedit" id="p-body" aria-label="Proposal document" placeholder="Markdown">${esc(p.body)}</textarea>`:`<div class="md">${md(p.body)||'<p>Empty.</p>'}</div>`}</div>
      ${section(`Changes · ${items.length}`,`<div class="items">${items.map(it=>`<div class="item"><span class="kind">${it.kind}</span><span>${esc(it.label)}</span><button data-act="${it.act}" aria-label="Remove">×</button></div>`).join('')}</div>`)}
      ${p.status==='archived'
        ?`<div class="btns"><span class="arch">Closed by ${esc(p.pr||'—')}</span><button class="btn" data-act="reopen">Reopen</button></div>`
        :section('Archive',`<div class="archrow"><input id="p-pr" placeholder="PR #" autocomplete="off" aria-label="Pull request"><button class="btn" data-act="archive">Archive</button></div>`)}`;
  }
  drawer.hidden=!h;
  drawer.classList.toggle('wide',P()&&state.pi!=null&&!state.sel&&!state.form);
  drawer.innerHTML=h;
  if(state.form) setTimeout(()=>document.getElementById('f-name')?.focus(),0);
}

function render(){build();renderMap();renderDrawer()}
function select(id){state.sel=id;state.hover=null;state.form=null;state.noteDraft=null;state.splitting=null;render()}
function syncModeButtons(){
  document.getElementById('m-explore').setAttribute('aria-pressed',state.mode==='explore');
  document.getElementById('m-propose').setAttribute('aria-pressed',state.mode==='propose');
  document.getElementById('addmod').hidden=state.mode!=='propose';
}
function setMode(mode){
  state.mode=mode;state.connectFrom=null;state.form=null;state.focus=false;state.noteDraft=null;
  if(mode==='propose'){state.sel=null;state.pi=null;state.editing=false}
  syncModeButtons();render();
}
function submitForm(){
  const F=state.form,name=document.getElementById('f-name').value.trim();
  if(!name) return;
  if(F.type==='mod'){
    const a=areas.find(x=>x.id===document.getElementById('f-area').value);
    const mem=a?MODS.filter(m=>a.mods.includes(m.id)):[];
    const low=mem.length?mem.reduce((p,m)=>m.y+fullH(m)>p.y+fullH(p)?m:p):null;
    const id='qm'+(seq++);
    prop().mods.push({id,lane:low?low.lane:'server',name,x:low?low.x:1490,y:low?low.y+fullH(low)+24:Math.max(...MODS.map(m=>m.y+fullH(m)))+70,w:low?low.w:210});
    if(a) a.mods.push(id);
    state.form=null;render();return;
  }
  const f={id:'qf'+(seq++),mod:F.mod,label:name};
  if(F.mod==='entry') f.m=document.getElementById('f-m').value;
  if(F.mod==='pages') f.m='PAGE';
  if(MODS.find(x=>x.id===F.mod)?.ext) f.k=document.getElementById('f-k').value;
  prop().fns.push(f);touch();state.form=null;state.sel=f.id;render();
}
function removeFn(id){const p=prop();touch();p.fns=p.fns.filter(f=>f.id!==id);p.edges=p.edges.filter(e=>e.from!==id&&e.to!==id)}

function canvasSize(){const r=svg.getBoundingClientRect();return {r,W:r.width-((!drawer.hidden&&r.width>900)?drawer.offsetWidth:0)}}
function fit(){
  const {r,W}=canvasSize();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  MODS.forEach(m=>{x0=Math.min(x0,m.x-50);y0=Math.min(y0,m.y-44);x1=Math.max(x1,m.x+m.w+20);y1=Math.max(y1,m.y+fullH(m)+20)});
  if(!state.focus) areas.forEach(a=>{if(!a.mods.length&&a.x!=null){x0=Math.min(x0,a.x);y0=Math.min(y0,a.y);x1=Math.max(x1,a.x+260);y1=Math.max(y1,a.y+140)}});
  const pad=W<600?12:28,top=58;
  const k=Math.min((W-pad*2)/(x1-x0),(r.height-top-pad)/(y1-y0),1.4);
  state.view={k,x:(W-(x1-x0)*k)/2-x0*k,y:top-y0*k};
  renderMap();
}
function centerOn(id){
  const {r,W}=canvasSize(),{m}=NODE[id],[,cy]=anchor(id,'l'),k=Math.max(state.view.k,.9);
  state.view={k,x:W/2-(m.x+m.w/2)*k,y:r.height/2-cy*k};state.touchedView=true;renderMap();
}
function zoomAt(cx,cy,f){
  const v=state.view,k=Math.min(3,Math.max(.2,v.k*f));
  v.x=cx-(cx-v.x)*(k/v.k);v.y=cy-(cy-v.y)*(k/v.k);v.k=k;state.touchedView=true;renderMap();
}

// pan the canvas, or drag a module by its title
let drag=null;
svg.addEventListener('pointerdown',e=>{
  const ah=e.target.closest('.ahead');
  if(ah){
    const a=areas.find(x=>x.id===ah.dataset.area),r=areaRect(a);
    drag={area:a.id,x:e.clientX,y:e.clientY,start:MODS.filter(m=>a.mods.includes(m.id)).map(m=>({id:m.id,x:m.x,y:m.y})),ax:r.x,ay:r.y,moved:false};return;
  }
  const head=e.target.closest('.mhead');
  if(head&&!e.target.closest('[data-add]')){const m=MODS.find(x=>x.id===head.dataset.mod);drag={mod:m.id,x:e.clientX,y:e.clientY,mx:m.x,my:m.y,moved:false};return}
  drag={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y,moved:false};
});
window.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<4) return;
  drag.moved=true;svg.classList.add('dragging');
  const k=state.view.k;
  if(drag.mod) setModPos(drag.mod,Math.round(drag.mx+dx/k),Math.round(drag.my+dy/k));
  else if(drag.area){
    drag.start.forEach(s=>setModPos(s.id,Math.round(s.x+dx/k),Math.round(s.y+dy/k)));
    if(!drag.start.length){const a=areas.find(x=>x.id===drag.area);a.x=Math.round(drag.ax+dx/k);a.y=Math.round(drag.ay+dy/k)}
  }else{state.view.x=drag.vx+dx;state.view.y=drag.vy+dy;state.touchedView=true}
  renderMap();
});
window.addEventListener('pointerup',()=>{
  svg.classList.remove('dragging');
  if(drag&&drag.mod&&drag.moved){assignArea(drag.mod,drag.mx,drag.my);renderMap();if(state.sel&&state.sel.startsWith('area:'))renderDrawer()}
  setTimeout(()=>drag=null,0);
});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015))},{passive:false});

svg.addEventListener('click',e=>{
  if(drag&&drag.moved) return;
  const a=e.target.closest('[data-add]');
  if(a){state.form={type:'fn',mod:a.dataset.add};state.sel=null;state.connectFrom=null;render();return}
  const t=e.target.closest('[data-toggle]');
  if(t){const id=t.dataset.toggle;state.collapsed.has(id)?state.collapsed.delete(id):state.collapsed.add(id);renderMap();return}
  const ar=e.target.closest('[data-area]');
  const pick=id=>e.shiftKey?toggleMulti(id):select(id);
  if(ar&&!state.connectFrom){pick('area:'+ar.dataset.area);return}
  const mh=e.target.closest('[data-mod]');
  if(mh&&!state.connectFrom){pick('mod:'+mh.dataset.mod);return}
  const n=e.target.closest('[data-node]');
  if(state.connectFrom){
    const from=state.connectFrom,to=n&&n.dataset.node;
    if(to&&to!==from&&!EDGES.some(x=>x.from===from&&x.to===to)){prop().edges.push({from,to});touch()}
    state.connectFrom=null;select(from);return;
  }
  if(n) pick(n.dataset.node);
  else{state.sel=null;state.form=null;state.focus=false;render()}
});

drawer.addEventListener('click',e=>{
  const n=e.target.closest('[data-node]');
  if(n){select(n.dataset.node);return}
  const op=e.target.closest('[data-open]');
  if(op){state.pi=+op.dataset.open;state.editing=false;state.sel=null;render();return}
  const ps=e.target.closest('[data-plstatus]');
  if(ps){state.plist.status=ps.dataset.plstatus;renderDrawer();return}
  const ms=e.target.closest('[data-modsel]');
  if(ms){select('mod:'+ms.dataset.modsel);return}
  const a=e.target.closest('[data-act]');if(!a) return;
  const act=a.dataset.act,p=prop();
  if(act==='list'){state.pi=null;state.editing=false;render();return}
  if(act==='editdoc'){state.editing=true;renderDrawer();setTimeout(()=>document.getElementById('p-body')?.focus(),0);return}
  if(act==='donedoc'){state.editing=false;renderDrawer();return}
  if(act==='archive'){p.status='archived';p.pr=document.getElementById('p-pr').value.trim();touch();render();return}
  if(act==='reopen'){p.status='open';touch();render();return}
  if(act.startsWith('unsel:')){toggleMulti(act.slice(6));return}
  if(act==='splitsel'){
    const ids=state.multi,src=NODE[ids[0]].m,left=src.fns.filter(f=>!f.prop).length-ids.length,id='s'+(sseq++);
    splits.push({id,from:src.id,name:src.name.split('/').pop()+' · new',fns:[...ids],x:src.x,y:src.y+HEAD+left*ROW+PAD+34});
    areas.forEach(a=>{if(a.mods.includes(src.id))a.mods.push(id)});
    select('mod:'+id);
    setTimeout(()=>{const i=document.getElementById('s-rename');if(i){i.focus();i.select()}},0);return;
  }
  if(act==='areasel'){
    const mods=state.multi.map(x=>x.slice(4)),id='a'+(aseq++);
    mods.forEach(mid=>leaveAreas(mid));
    areas.push({id,name:'New area',mods});
    select('area:'+id);
    setTimeout(()=>{const i=document.getElementById('a-name');if(i){i.focus();i.select()}},0);return;
  }
  if(act==='split'){state.splitting=state.sel.slice(4);renderDrawer();return}
  if(act==='cancelsplit'){state.splitting=null;renderDrawer();return}
  if(act==='dosplit'){
    const ids=[...drawer.querySelectorAll('.chk input:checked')].map(i=>i.value),src=MODS.find(x=>x.id===state.splitting);
    const name=document.getElementById('s-name').value.trim();
    if(!src||!ids.length||!name) return;
    const left=src.fns.filter(f=>!f.prop).length-ids.length;
    if(left<1) return;
    const id='s'+(sseq++);
    splits.push({id,from:src.id,name,fns:ids,x:src.x,y:src.y+HEAD+left*ROW+PAD+34});
    areas.forEach(a=>{if(a.mods.includes(src.id))a.mods.push(id)});
    select('mod:'+id);return;
  }
  if(act==='merge'){
    const sid=state.sel.slice(4),i=splits.findIndex(s=>s.id===sid);if(i<0) return;
    const from=splits[i].from;splits.splice(i,1);
    areas.forEach(a=>a.mods=a.mods.filter(x=>x!==sid));delete POS[sid];
    select('mod:'+from);return;
  }
  if(act.startsWith('rmarea:')){leaveAreas(act.slice(7));render();return}
  if(act==='delarea'){const i=areas.findIndex(a=>'area:'+a.id===state.sel);if(i>=0)areas.splice(i,1);state.sel=null;render();return}
  if(act==='close'||act==='cancel'){state.sel=null;state.form=null;state.connectFrom=null;state.focus=false;render()}
  else if(act==='submit') submitForm();
  else if(act==='connect'){state.connectFrom=state.sel;renderMap()}
  else if(act==='remove'){removeFn(state.sel);state.sel=null;render()}
  else if(act==='newprop'){proposals.push({name:'Untitled',status:'open',updated:today(),body:'',mods:[],fns:[],edges:[]});state.pi=proposals.length-1;state.editing=true;render();
    setTimeout(()=>{const t=document.getElementById('p-name');if(t){t.focus();t.select()}},0)}
  else if(act.startsWith('rm-fn:')){removeFn(act.slice(6));render()}
  else if(act.startsWith('rm-mod:')){const id=act.slice(7);p.fns.filter(f=>f.mod===id).forEach(f=>removeFn(f.id));p.mods=p.mods.filter(m=>m.id!==id);render()}
  else if(act.startsWith('rm-edge:')){p.edges.splice(+act.slice(8),1);render()}
});
drawer.addEventListener('change',e=>{if(e.target.id==='pl-sort'){state.plist.sort=e.target.value;renderDrawer()}});
drawer.addEventListener('input',e=>{
  if(e.target.id==='p-name'){prop().name=e.target.value||'Untitled';touch()}
  if(e.target.id==='p-body'){prop().body=e.target.value;touch()}
  if(e.target.id==='s-rename'){const s=splits.find(x=>'mod:'+x.id===state.sel);if(s){s.name=e.target.value||'Untitled';drawer.querySelector('h2').textContent=s.name;build();renderMap()}}
  if(e.target.id==='pl-q'){state.plist.q=e.target.value;document.getElementById('plist').innerHTML=plRows()}
  if(e.target.id==='a-name'){const a=areas.find(x=>'area:'+x.id===state.sel);if(a){a.name=e.target.value||'Untitled';drawer.querySelector('h2').textContent=a.name;renderMap()}}
});
drawer.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.form&&e.target.tagName==='INPUT'){e.preventDefault();submitForm()}});
drawer.addEventListener('mouseover',e=>{const n=e.target.closest('.trow[data-node],.lnk[data-node]');const id=n?n.dataset.node:null;if(id!==state.hover){state.hover=id;renderMap()}});
drawer.addEventListener('mouseleave',()=>{if(state.hover){state.hover=null;renderMap()}});

// search
const q=document.getElementById('q'),results=document.getElementById('results');
let hits=[];
function runSearch(){
  const s=q.value.trim().toLowerCase();
  if(!s){results.hidden=true;hits=[];return}
  hits=Object.keys(NODE).map(id=>{const {f,m}=NODE[id];return {id,text:qn(id),where:m.name,hay:(qn(id)+' '+m.name+' '+(SRC[id]?.file||'')+' '+(SRC[id]?.doc||'')).toLowerCase()}})
    .filter(x=>x.hay.includes(s)).slice(0,8);
  results.innerHTML=hits.length?hits.map((x,i)=>`<button class="res ${i?'':'act'}" data-go="${x.id}"><span>${esc(x.text)}</span><span class="m">${esc(x.where)}</span></button>`).join(''):`<div class="res"><span class="m">No matches</span></div>`;
  results.hidden=false;
}
function go(id){state.collapsed.delete(NODE[id].m.id);q.value='';results.hidden=true;select(id);centerOn(id)}
q.addEventListener('input',runSearch);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&hits[0]){e.preventDefault();go(hits[0].id)}if(e.key==='Escape'){q.value='';results.hidden=true;q.blur()}});
results.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
q.addEventListener('blur',()=>setTimeout(()=>results.hidden=true,150));

// saved views
const vbtn=document.getElementById('viewsbtn'),vpop=document.getElementById('views');
function renderViews(){
  vpop.innerHTML=views.map((v,i)=>`<div class="vrow"><button class="res" data-view="${i}"><span>${esc(v.name)}</span></button><button class="del" data-delview="${i}" aria-label="Delete view">×</button></div>`).join('')
    +`<div class="vsave"><input id="v-name" placeholder="Save current as…" autocomplete="off" aria-label="View name"><button data-act="saveview">Save</button></div>`;
}
function saveView(){
  const name=document.getElementById('v-name').value.trim();if(!name) return;
  views.push({name,sel:state.sel,multi:[...state.multi],focus:state.focus,collapsed:[...state.collapsed],pos:JSON.parse(JSON.stringify(POS)),mode:state.mode,pi:state.pi});
  renderViews();
}
function applyView(v){
  state.mode=v.mode||'explore';syncModeButtons();
  if(v.pi!=null) state.pi=v.pi;
  state.sel=v.sel;state.multi=v.multi||[];state.focus=v.focus;state.collapsed=new Set(v.collapsed);
  Object.keys(POS).forEach(k=>delete POS[k]);Object.assign(POS,JSON.parse(JSON.stringify(v.pos||{})));
  state.form=null;state.connectFrom=null;state.noteDraft=null;state.hover=null;state.touchedView=false;
  build();renderDrawer();fit();
}
vbtn.onclick=()=>{const open=vpop.hidden;vpop.hidden=!open;vbtn.setAttribute('aria-expanded',open);if(open)renderViews()};
vpop.addEventListener('click',e=>{
  const a=e.target.closest('[data-view]');if(a){applyView(views[+a.dataset.view]);vpop.hidden=true;vbtn.setAttribute('aria-expanded',false);return}
  const d=e.target.closest('[data-delview]');if(d){views.splice(+d.dataset.delview,1);renderViews();return}
  if(e.target.closest('[data-act="saveview"]')) saveView();
});
vpop.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='v-name'){e.preventDefault();saveView()}});
document.addEventListener('click',e=>{if(vpop.hidden||e.target===vbtn||vpop.contains(e.target)||!document.contains(e.target))return;vpop.hidden=true;vbtn.setAttribute('aria-expanded',false)});

document.getElementById('addarea').onclick=()=>{
  const id='a'+(aseq++),sm=state.sel&&state.sel.startsWith('mod:')?state.sel.slice(4):null;
  if(sm) leaveAreas(sm);
  const bottom=Math.max(...MODS.map(m=>m.y+fullH(m)),...areas.map(a=>{const r=areaRect(a);return r?r.y+r.h:0}));
  areas.push({id,name:'New area',mods:sm?[sm]:[],x:20,y:bottom+40});
  select('area:'+id);
  setTimeout(()=>{const i=document.getElementById('a-name');if(i){i.focus();i.select()}},0);
};
document.getElementById('m-explore').onclick=()=>setMode('explore');
document.getElementById('m-propose').onclick=()=>setMode('propose');
document.getElementById('fit').onclick=fit;
document.getElementById('focus').onclick=()=>{if(!state.sel)return;state.focus=!state.focus;build();fit();renderDrawer()};
document.getElementById('collapse').onclick=()=>{state.collapsed.size?state.collapsed.clear():MODS.forEach(m=>!m.entry&&state.collapsed.add(m.id));renderMap()};
document.getElementById('reset').onclick=()=>{Object.keys(POS).forEach(k=>delete POS[k]);build();fit()};
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.2)};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.2)};
document.getElementById('addmod').onclick=()=>{state.form={type:'mod'};state.sel=null;state.connectFrom=null;render()};
window.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();q.focus();return}
  if(e.key!=='Escape'||e.target===q) return;
  if(state.connectFrom){state.connectFrom=null;renderMap();return}
  if(e.target.id==='p-body'||e.target.id==='pl-q') return;
  if(!state.sel&&!state.form&&P()&&state.pi!=null){state.pi=null;state.editing=false;render();return}
  state.sel=null;state.form=null;state.hover=null;state.focus=false;render();
});
window.addEventListener('resize',()=>{if(!state.touchedView)fit()});

render();fit();
</script>
