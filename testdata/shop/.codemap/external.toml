[[node]]
id = "ext:stripe"
owner = "Payments team"
setup = "Live and test accounts; key in STRIPE_SECRET_KEY"
limits = "100 read and 100 write requests per second in live mode"
links = [
  {label = "Dashboard", url = "https://dashboard.stripe.com"},
  {label = "API docs", url = "https://docs.stripe.com/api"},
  {label = "Status", url = "https://status.stripe.com"},
]

[[node]]
id = "ext:postmark"
owner = "Platform team"
setup = "Server token in POSTMARK_TOKEN"
links = [
  {label = "Account", url = "https://account.postmarkapp.com"},
  {label = "Docs", url = "https://postmarkapp.com/developer"},
]

[[edge]]
from = "ext:stripe"
to = "route:POST /webhooks/stripe"
detail = "sends payment_intent.succeeded"
